name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v6

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.11.1 kur
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Debug APK derle
        run: gradle assembleDebug
